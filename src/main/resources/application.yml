server:
  # 信任反向代理傳入的 X-Forwarded-* headers
  # 讓 Spring Boot 知道前面有 Nginx，正確產生 redirect URL（https）
  forward-headers-strategy: native

spring:
  application:
    name: petSystem
  profiles:
    active: dev
  jpa:
    defer-datasource-initialization: true
    show-sql: false

# Application Info
app:
  version: ${APP_VERSION:1.0.0}
  cookie:
    # Cookie Secure 屬性：正式環境（HTTPS）設 true
    secure: ${COOKIE_SECURE:false}

# CORS Configuration
# 正式環境改為 https://your-domain.com
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8080}

# Logging Configuration
logging:
  level:
    com.pet: INFO
    com.pet.service: INFO
    com.pet.web: INFO

# JWT Configuration
jwt:
  # 密鑰 (生產環境請使用環境變數或加密配置)
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-environment-please-use-strong-secret-key-for-security}
  # Access Token 有效期 (毫秒) - 默認 15 分鐘
  access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  # Refresh Token 有效期 (毫秒) - 默認 7 天
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # Token 發行者
  issuer: ${JWT_ISSUER:pet-care-system}

# File Storage Configuration
file:
  storage:
    base-path: ${FILE_STORAGE_PATH:./uploads/photos}
    max-file-size: 10485760  # 10MB

# LINE Messaging API Configuration
line:
  messaging:
    channel-token: ${LINE_CHANNEL_TOKEN:}
    channel-secret: ${LINE_CHANNEL_SECRET:}
    # Demo mode: all notifications go to this user (for interview demo)
    demo-user-id: ${LINE_DEMO_USER_ID:}
    base-url: ${LINE_BASE_URL:http://localhost:8080}
    frontend-url: ${LINE_FRONTEND_URL:http://localhost:3000}
    enabled: true
  login:
    channel-id: ${LINE_LOGIN_CHANNEL_ID:}
    channel-secret: ${LINE_LOGIN_CHANNEL_SECRET:}
    callback-url: ${LINE_BASE_URL:http://localhost:8080}/api/auth/oauth2/callback/line
    frontend-callback-url: ${LINE_FRONTEND_URL:http://localhost:3000}/line-callback.html
